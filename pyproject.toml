[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alidade"
version = "0.1.0"
description = "A toolkit for managing GIS projects as code, built for working with an LLM."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.1.3",
    "lxml>=6.1.0",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "mapclassify>=2.10.0",
    "geopy>=2.4.1",
    "matplotlib>=3.10.9",
    "palettable>=3.3.3",
    "libpysal>=4.14.1",
    "esda>=2.9.0",
    "scipy>=1.15.0",
    "statsmodels>=0.14.0",
    "rasterio>=1.5.0",
    "rasterstats>=0.21.0",
    "pysheds>=0.5",
    "arcgis>=2.4.3",
    "azure-storage-blob>=12.1,<=12.17",
    "openpyxl>=3.1.5",
    "contextily>=1.7.1",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "qgis-stubs>=0.2.0",
    "types-geopandas>=1.1.3",
]

[project.scripts]
alidade-build = "alidade.build:main"
alidade-build-layer = "alidade.build:build_layer_main"
alidade-makefile = "alidade.makefile_gen:main"
alidade-map = "alidade.render_map:main"
alidade-dump = "alidade.dump_qgis:main"
alidade-extent = "alidade.extent:main"
alidade-validate = "alidade.validate:main"
alidade-publish = "alidade.publish_arcgis:main"
alidade-init = "alidade.scaffold:main"
alidade-mkinclude = "alidade.mkinclude:main"

[tool.hatch.build.targets.wheel]
packages = ["alidade"]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["qgis.PyQt.*", "qgis.utils"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["palettable", "palettable.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["libpysal", "libpysal.*", "esda", "esda.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyogrio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["contextily", "contextily.*", "rasterio", "rasterio.*", "mapclassify", "mapclassify.*", "rasterstats", "rasterstats.*", "pysheds", "pysheds.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arcgis", "arcgis.*"]
ignore_missing_imports = true


[tool.black]
line-length = 88
extend-exclude = ".venv"
